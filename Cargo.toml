[package]
name = "dotonce"
version = "0.0.1"
publish = false
edition = "2024"
rust-version = "1.85"
description = "Memory and mistake checks for AI coding agents. Correct your agent once."
license = "MIT"
repository = "https://github.com/dotbrainhq/dotonce"
readme = "README.md"
keywords = ["ai", "agents", "memory", "claude-code", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
